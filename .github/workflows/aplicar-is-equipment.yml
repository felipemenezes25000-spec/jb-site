name: Aplicar isEquipment

on:
  push:
    branches: [plataforma]
    paths:
      - .github/workflows/aplicar-is-equipment.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plataforma
          fetch-depth: 0

      - name: Ajustar assert ao formato atual do admin
        run: sed -i 's/for _ in range(2):/for _ in range(1):/' .github/scripts/aplicar_is_equipment.py

      - name: Aplicar patch de domínio
        run: python .github/scripts/aplicar_is_equipment.py

      - name: Commitar patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(dominio): distingue equipamento de peça e consumível"
          git push origin HEAD:plataforma
